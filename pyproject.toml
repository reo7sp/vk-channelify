[project]
name = "vk-channelify"
version = "1.0.0"
description = "VK to Telegram channel reposter"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg2-binary==2.9.12",
    "requests==2.34.2",
    "python-telegram-bot[webhooks]==22.8",
    "prometheus-client==0.26.0",
    "structlog (==26.1.0)",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pyhamcrest==2.1.0",
    "ruff (==0.16.3)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
