[project]
name = "vk-channelify"
version = "1.0.0"
description = "VK to Telegram channel reposter"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "SQLAlchemy==1.4.54",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.11",
    "requests==2.31.0",
    "python-telegram-bot==13.15",
    "prometheus-client==0.21.1",
    # APScheduler 3.6.3 imports pkg_resources, removed from newer setuptools.
    "setuptools>=68,<81",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "pyhamcrest==2.1.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
